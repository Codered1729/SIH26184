services:
  - type: web
    name: sentinel-sih26184
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  - type: cron
    name: sentinel-keepalive-pinger
    runtime: image
    image:
      url: curlimages/curl:latest
    schedule: "*/10 * * * *"
    plan: free
    startCommand: "curl -fsS --max-time 25 https://sentinel-sih26184.onrender.com/health"
